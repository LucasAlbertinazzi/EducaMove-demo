<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/painel/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EducaMov — painel administrativo de reembolso do transporte escolar.">
  <meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1722" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EducaMov">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>EducaMov</title>
  <style>
    :root{color-scheme:light dark;--background:#F7F9FC;--text:#1F2D3D;--brand:#245B86}
    @media(prefers-color-scheme:dark){:root{--background:#0F1722;--text:#E5EDF5;--brand:#91BDEA}}
    html,body{margin:0;background:var(--background)}
    #loading{height:100vh;display:grid;place-content:center;font:16px system-ui,sans-serif;color:var(--text)}
    #loading strong{font-size:28px;margin-bottom:12px;color:var(--brand)}
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>EducaMov</strong><span>Carregando painel…</span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
