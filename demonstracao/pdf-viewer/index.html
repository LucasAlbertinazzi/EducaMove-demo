<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Documento da solicitação</title>
  <style>
    :root{color-scheme:light;--bg:#f7f9fc;--surface:#fff;--text:#1f2d3d;--border:#e0e6ed}
    :root[data-theme=dark]{color-scheme:dark;--bg:#0f1722;--surface:#182331;--text:#e5edf5;--border:#354456}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}
    header{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;background:var(--surface);border-bottom:1px solid var(--border)}
    button{border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);min-width:32px;min-height:32px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:2px solid #245b86;outline-offset:2px}
    main{padding:16px;overflow:auto;min-height:200px;text-align:center}canvas{display:block;margin:0 auto;background:white;box-shadow:0 1px 5px #0002}#status{padding:20px;line-height:1.5}#page-label{min-width:100px;text-align:center}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>
  <header aria-label="Controles do PDF">
    <button id="previous" aria-label="Página anterior" disabled>‹</button>
    <span id="page-label" aria-live="polite">Carregando…</span>
    <button id="next" aria-label="Próxima página" disabled>›</button>
    <button id="zoom-out" aria-label="Diminuir zoom" disabled>−</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" aria-label="Aumentar zoom" disabled>+</button>
  </header>
  <main><p id="status" role="status">Carregando documento…</p><canvas id="page" role="img" aria-label="Página do documento" hidden></canvas><div id="document-text" class="sr-only"></div></main>
  <script type="module" src="viewer.mjs"></script>
</body>
</html>
